<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Student Expense Tracker</h1>
      <p>Record and manage your daily expenses</p>
    </header>

    


    <form id="expense-form" novalidate>
      <div class="form-group">
        <label for="expense-name">Expense Name</label>
        <input type="text" id="expense-name" placeholder="e.g. Books, tickets" required />
      </div>

      <div class="form-group">
        <label for="expense-amount">Amount (₹)</label>
        <input type="number" id="expense-amount" placeholder="e.g., 100"  required />
      </div>

      <div class="form-group">
        <label for="expense-category">Category</label>
        <select id="expense-category" required>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <button type="submit" class="btn-add">Add Expense</button>
    </form>

    <p id="error-message" class="error-msg"></p>

    

    <div class="controls">
      <div class="total-box">
        Total Spent: <span id="total-amount">₹0.00</span>
      </div>

      <div class="filter-box">
        <label for="filter-category">Filter by Category:</label>
        <select id="filter-category">
          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

   

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Expense Name</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="expense-list">
          
            
        </tbody>
      </table>
      <p id="empty-state" class="empty-msg">No expenses recorded yet.</p>
    </div>
  </div>

  <script src="track.js"></script>
</body>
</html>
